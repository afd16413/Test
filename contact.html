<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact | IELTS Academic Reading</title>
<style>
:root{--primary:#1d4ed8;--accent:#f97316;--paper:#f8fafc;--ink:#111827;--muted:#374151;--white:#fff}
*{box-sizing:border-box}
[hidden]{display:none!important}body{margin:0;min-height:100vh;color:var(--ink);background:var(--paper);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
header{background:var(--primary);color:var(--white);border-bottom:4px solid var(--accent)}
.topbar{max-width:1080px;margin:auto;padding:22px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{font-size:1.05rem;font-weight:750;letter-spacing:.02em}.brand span{color:var(--accent)}
a.brand{color:inherit;text-decoration:none}
.navlinks{display:flex;gap:10px;flex-wrap:wrap}
.navlinks a{color:var(--primary);background:var(--accent);text-decoration:none;font-weight:700;font-size:.9rem;padding:9px 16px;border-radius:8px}
.navlinks a.alt{background:transparent;color:var(--white);border:1px solid #ffffff66}
.contact { max-width: 960px; margin: 56px auto 40px; padding: 0 24px; }
.panel{background:var(--white);border:1px solid #dde3ea;border-radius:16px;padding:24px;box-shadow:0 12px 35px #13243a0b}
.panel h2{margin:0 0 8px;color:var(--primary);font-size:1.2rem}.panel p{margin:0;color:var(--muted);line-height:1.6}
.contact label { display: block; font-weight: 700; font-size: .9rem; margin: 14px 0 6px; }
.contact input, .contact textarea { width: 100%; padding: 11px 13px; border: 1px solid #c5cdd8; border-radius: 9px; font: inherit; }
.contact button { margin-top: 16px; padding: 12px 18px; border: 0; border-radius: 9px; background: var(--primary); color: #fff; font-weight: 700; cursor: pointer; }
.contact button:disabled { opacity: .6; }
#contact-msg { margin-top: 12px; font-size: .9rem; }
footer{max-width:960px;margin:48px auto 0;padding:22px 24px 32px;color:var(--muted);font-size:.82rem}
</style>
<link rel="stylesheet" href="css/site.css">
<script src="js/theme.js"></script>
</head>
<body>
<header class="site-header" id="siteHeader"></header>
<script src="js/site-nav.js"></script>
<section class="contact" id="contact">
  <div class="panel">
    <h2>Ready to improve your IELTS score?</h2>
    <p>Create a free account to take practice tests, or send us a message about tutoring.</p>
  </div>
  <div class="panel" style="margin-top:20px">
    <h2>Contact us about tutoring</h2>
    <p>Tell us your target band score and when you plan to take the test.</p>
    <form id="contact-form">
      <label for="c-name">Name</label>
      <input id="c-name" required maxlength="100">
      <label for="c-email">Email</label>
      <input id="c-email" type="email" required maxlength="254">
      <label for="c-message">Message</label>
      <textarea id="c-message" rows="4" required maxlength="2000"></textarea>
      <button id="contact-button" type="submit">Send message</button>
    </form>
    <div id="contact-msg" role="status" aria-live="polite"></div>
  </div>
</section>
<footer>IELTS Academic Reading · Practice platform</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const sb = window.supabase.createClient(
    'https://yfsxbiqszvrqhsdcuwyr.supabase.co',
    'sb_publishable_W1BJsbUOZdR0dm5Ai_yHJg_J64HYtPH'
  );
  const msg = document.getElementById('contact-msg');
  document.getElementById('contact-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('contact-button');
    btn.disabled = true;
    const { error } = await sb.from('enquiries').insert({
      name: document.getElementById('c-name').value.trim(),
      email: document.getElementById('c-email').value.trim(),
      message: document.getElementById('c-message').value.trim()
    });
    btn.disabled = false;
    if (error) {
      msg.style.color = '#b42318';
      msg.textContent = 'Sorry, your message could not be sent. Please try again.';
    } else {
      e.target.reset();
      msg.style.color = '#17703a';
      msg.textContent = 'Thank you. We will reply to you soon.';
    }
  });
</script>
<script>
  // If the student is already signed in, show the student area link instead of the sign-in links.
  if (window.supabase) {
    const navClient = window.supabase.createClient(
      'https://yfsxbiqszvrqhsdcuwyr.supabase.co',
      'sb_publishable_W1BJsbUOZdR0dm5Ai_yHJg_J64HYtPH'
    );
  }
</script>
</body>
</html>
