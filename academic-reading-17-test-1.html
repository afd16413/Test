<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reading test</title>
<style>
:root { --navy: #1f2d5c; --navy-2: #2c3f7d; --navy-soft: #e8ecf5; --gold: #f4c542; --gold-2: #e6b530; --bg: #f2f4f8; --line: #dfe3ec; --line-2: #c4cbda; --text: #1c2433; --muted: #5d6679; --danger: #b42318; --danger-bg: #fdecea; --success: #17703a; --shadow: 0 1px 2px rgba(16,24,40,.05), 0 4px 14px rgba(16,24,40,.06); }
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif; font-size: 15px; line-height: 1.5; }
button, input, select, textarea { font: inherit; color: inherit; }
.header { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; background: var(--navy); color: #fff; padding: 12px 24px; box-shadow: 0 2px 10px rgba(15,23,42,.18); }
.brand { font-weight: 700; font-size: 17px; white-space: nowrap; }
.brand span { font-weight: 400; opacity: .75; }
.test-title { flex: 1; min-width: 140px; font-size: 14px; opacity: .9; }
.student-name { width: 170px; border: none; border-radius: 6px; padding: 7px 10px; font-size: 14px; }
.timer { min-width: 76px; text-align: center; background: #fff; color: var(--navy); padding: 6px 12px; border-radius: 6px; font-weight: 700; font-variant-numeric: tabular-nums; }
.timer.warn { background: var(--gold); }
.btn { background: var(--gold); color: var(--navy); border: none; border-radius: 6px; padding: 8px 14px; font-weight: 600; font-size: 14px; cursor: pointer; }
.btn:hover { background: var(--gold-2); }
.btn:disabled { opacity: .5; cursor: default; background: var(--gold); }
.parts { display: flex; gap: 2px; flex-wrap: wrap; background: #fff; border-bottom: 1px solid var(--line); padding: 0 24px; }
.parts button { background: none; border: none; border-bottom: 3px solid transparent; color: var(--muted); font-size: 14px; font-weight: 600; padding: 12px 16px; cursor: pointer; }
.parts button.active { color: var(--navy); border-bottom-color: var(--navy); }
.split { display: grid; grid-template-columns: 1fr 1fr; height: calc(100vh - 112px); }
.passage, .questions { overflow: auto; padding: 28px 36px 64px; }
.passage { background: #fff; border-right: 1px solid var(--line); line-height: 1.75; }
.passage h2 { margin: 0 0 16px; color: var(--navy); font-size: 22px; }
.passage p { margin: 0 0 14px; text-align: justify; }
.questions { background: var(--bg); }
.instr { font-weight: 600; margin-bottom: 18px; padding: 12px 14px; background: #fff; border: 1px solid var(--line); border-left: 4px solid var(--navy); border-radius: 6px; }
.qhead { margin-top: 26px; color: var(--navy); font-weight: 700; font-size: 16px; }
.qinstr { margin: 4px 0 12px; color: var(--muted); font-style: italic; white-space: pre-line; }
.notes { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 16px 20px; }
.nbox { text-align: center; font-size: 18px; margin: 0 0 8px; }
.nh, .noteline, .nt { line-height: 2; margin: 8px 0; }
.nh { font-weight: 700; }
.optbox { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 12px 16px; margin-bottom: 12px; }
.optbox div { margin: 4px 0; }
.stmt { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; margin-bottom: 10px; }
.stmt-text { margin-bottom: 8px; }
.tf label { display: inline-block; margin-right: 18px; cursor: pointer; font-size: 14px; }
.opt { display: block; cursor: pointer; font-size: 14px; margin: 5px 0; }
.qno { display: inline-block; min-width: 26px; height: 22px; line-height: 22px; padding: 0 5px; text-align: center; background: var(--navy); color: #fff; border-radius: 4px; font-size: 12px; font-weight: 700; vertical-align: middle; margin-right: 6px; }
input.gap { width: 140px; padding: 4px 7px; border: 1px solid var(--line-2); border-radius: 4px; font-size: 14px; margin: 0 4px; vertical-align: middle; background: #fff; }
input.short { width: 100%; max-width: 320px; padding: 7px 9px; border: 1px solid var(--line-2); border-radius: 6px; font-size: 14px; }
select { padding: 6px 8px; font-size: 14px; max-width: 100%; border: 1px solid var(--line-2); border-radius: 6px; background: #fff; }
.result { background: #fff; border: 1px solid var(--navy); border-top: 4px solid var(--navy); border-radius: 8px; padding: 18px 20px; margin-bottom: 22px; box-shadow: var(--shadow); }
.result h3 { margin: 0 0 6px; color: var(--navy); }
.result table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 14px; }
.result th, .result td { padding: 7px 8px; text-align: left; border-bottom: 1px solid var(--line); }
.result tr.ok td:last-child { color: var(--success); font-weight: 700; }
.result tr.bad td:last-child { color: var(--danger); font-weight: 700; }
.msg { background: var(--danger-bg); color: var(--danger); padding: 12px 14px; border-radius: 6px; margin: 24px; }
@media (max-width: 820px) {
  .split { grid-template-columns: 1fr; height: auto; }
  .passage, .questions { padding: 20px 16px 40px; overflow: visible; }
  .header { padding: 10px 14px; }
  .parts { padding: 0 14px; }
}
</style>
</head>

<script>window.TEST_DATA = {"title":"Academic Reading 17 Test 1","time":60,"labels":true,"parts":[{"passageTitle":"The Dead Sea Scrolls","instruction":"Read the passage below and answer Questions 1–5.","paragraphs":["In late 1946 or early 1947, three Bedouin teenagers were tending their goats and sheep near the ancient settlement of Qumran, located on the northwest shore of the Dead Sea in what is now known as the West Bank. One of these young shepherds tossed a rock into an opening on the side of a cliff and was surprised to hear a shattering sound. He and his companions later entered the cave and stumbled across a collection of large clay jars, seven of which contained scrolls with writing on them. The teenagers took the seven scrolls to a nearby town where they were sold for a small sum to a local antiquities dealer. Word of the find spread, and Bedouins and archaeologists eventually unearthed tens of thousands of additional scroll fragments from 10 nearby caves; together they make up between 800 and 900 manuscripts. It soon became clear that this was one of the greatest archaeological discoveries ever made.","The origin of the Dead Sea Scrolls, which were written around 2,000 years ago between 150 BCE and 70 CE, is still the subject of scholarly debate even today. According to the prevailing theory, they are the work of a population that inhabited the area until Roman troops destroyed the settlement around 70 CE. The area was known as Judea at that time, and the people are thought to have belonged to a group called the Essenes, a devout Jewish sect.","The majority of the texts on the Dead Sea Scrolls are in Hebrew, with some fragments written in an ancient version of its alphabet thought to have fallen out of use in the fifth century BCE. But there are other languages as well. Some scrolls are in Aramaic, the language spoken by many inhabitants of the region from the sixth century BCE to the siege of Jerusalem in 70 CE. In addition, several texts feature translations of the Hebrew Bible into Greek.","The Dead Sea Scrolls include fragments from every book of the Old Testament of the Bible except for the Book of Esther. The only entire book of the Hebrew Bible preserved among the manuscripts from Qumran is Isaiah; this copy, dated to the first century BCE, is considered the earliest biblical manuscript still in existence. Along with biblical texts, the scrolls include documents about sectarian regulations and religious writings that do not appear in the Old Testament.","The writing on the Dead Sea Scrolls is mostly in black or occasionally red ink, and the scrolls themselves are nearly all made of either parchment (animal skin) or an early form of paper called ‘papyrus’. The only exception is the scroll numbered 3Q15, which was created out of a combination of copper and tin. Known as the Copper Scroll, this curious document features letters chiselled onto metal – perhaps, as some have theorized, to better withstand the passage of time. One of the most intriguing manuscripts from Qumran, this is a sort of ancient treasure map that lists dozens of gold and silver caches. Using an unconventional vocabulary and odd spelling, it describes 64 underground hiding places that supposedly contain riches buried for safekeeping. None of these hoards have been recovered, possibly because the Romans pillaged Judea during the first century CE. According to various hypotheses, the treasure belonged to local people, or was rescued from the Second Temple before its destruction or never existed to begin with.","Some of the Dead Sea Scrolls have been on interesting journeys. In 1948, a Syrian Orthodox archbishop known as Mar Samuel acquired four of the original seven scrolls from a Jerusalem shoemaker and part-time antiquity dealer, paying less than $100 for them. He then travelled to the United States and unsuccessfully offered them to a number of universities, including Yale. Finally, in 1954, he placed an advertisement in the business newspaper The Wall Street Journal – under the category ‘Miscellaneous Items for Sale’ – that read: ‘Biblical Manuscripts dating back to at least 200 B.C. are for sale. This would be an ideal gift to an educational or religious institution by an individual or group.’ Fortunately, Israeli archaeologist and statesman Yigael Yadin negotiated their purchase and brought the scrolls back to Jerusalem, where they remain to this day.","In 2017, researchers from the University of Haifa restored and deciphered one of the last untranslated scrolls. The university’s Eshbal Ratson and Jonathan Ben-Dov spent one year reassembling the 60 fragments that make up the scroll. Deciphered from a band of coded text on parchment, the find provides insight into the community of people who wrote it and the 364-day calendar they would have used. The scroll names celebrations that indicate shifts in seasons and details two yearly religious events known from another Dead Sea Scroll. Only one more known scroll remains untranslated."],"groups":[{"type":"GAP","heading":"Questions 1-5","instruction":"Complete the notes below. Choose ONE WORD ONLY from the passage for each answer.","items":[{"nos":[1],"answers":["rock"]},{"nos":[2],"answers":["cave"]},{"nos":[3],"answers":["clay"]},{"nos":[4],"answers":["Essenes"]},{"nos":[5],"answers":["Hebrew"]}],"box":"The Dead Sea Scrolls","lines":[{"kind":"h","text":"Discovery"},{"kind":"t","text":"Qumran, 1946/7"},{"kind":"t","text":"three Bedouin shepherds in their teens were near an opening on side of cliff"},{"kind":"b","text":"heard a noise of breaking when one teenager threw a {1}"},{"kind":"b","text":"teenagers went into the {2} and found containers made of {3}"},{"kind":"h","text":"The scrolls"},{"kind":"t","text":"date from between 150 BCE and 70 CE"},{"kind":"b","text":"thought to have been written by group of people known as the {4}"},{"kind":"b","text":"written mainly in the {5} language"},{"kind":"t","text":"most are on religious topics, written using ink on parchment or papyrus"}],"range":"1–5"},{"type":"TFNG","heading":"Questions 6–13","instruction":"Do the following statements agree with the information given in Reading Passage 1?","items":[{"nos":[6],"text":"The Bedouin teenagers who found the scrolls were disappointed by how little\nmoney they received for them.","answers":["NOT GIVEN"]},{"nos":[7],"text":"There is agreement among academics about the origin of the Dead Sea Scrolls.","answers":["FALSE"]},{"nos":[8],"text":"Most of the books of the Bible written on the scrolls are incomplete.","answers":["TRUE"]},{"nos":[9],"text":"The information on the Copper Scroll is written in an unusual way.","answers":["TRUE"]},{"nos":[10],"text":"Mar Samuel was given some of the scrolls as a gift.","answers":["FALSE"]},{"nos":[11],"text":"In the early 1950s, a number of educational establishments in the US were keen to buy scrolls from Mar Samuel.","answers":["FALSE"]},{"nos":[12],"text":"The scroll that was pieced together in 2017 contains information about annual occasions in the Qumran area 2,000 years ago.","answers":["TRUE"]},{"nos":[13],"text":"Academics at the University of Haifa are currently researching how to decipher the\nfinal scroll.","answers":["NOT GIVEN"]}],"range":"6–13"}]}],"editor":{"title":"Academic Reading 17 Test 1","time":60,"labels":true,"parts":[{"passageTitle":"The Dead Sea Scrolls","instruction":"Read the passage below and answer Questions 1–5.","paragraphs":["Urban beekeeping has grown quickly over the past two decades. In many large cities, flat rooftops and community gardens now house hives that would once have been found only in the countryside.","Supporters say that city hives help offset the decline of wild pollinators. Critics, however, warn that a dense concentration of hives can strain wild bee species that compete for the same flowers.","Experienced keepers agree that success depends on planning. Hives need a nearby water source, a sheltered position and neighbours who do not object."],"groups":[{"type":"GAP","heading":"Questions 1-5","instruction":"Complete the notes below. Choose ONE WORD ONLY from the passage for each answer.","box":"The Dead Sea Scrolls","items":[],"options":[],"lines":[{"kind":"h","text":"Discovery"},{"kind":"t","text":"Qumran, 1946/7"},{"kind":"t","text":"three Bedouin shepherds in their teens were near an opening on side of cliff"},{"kind":"b","text":"heard a noise of breaking when one teenager threw a [rock]"},{"kind":"b","text":"teenagers went into the [cave] and found containers made of [clay]"},{"kind":"h","text":"The scrolls"},{"kind":"t","text":"date from between 150 BCE and 70 CE"},{"kind":"b","text":"thought to have been written by group of people known as the [Essenes]"},{"kind":"b","text":"written mainly in the [Hebrew] language"},{"kind":"t","text":"most are on religious topics, written using ink on parchment or papyrus"}]},{"type":"TFNG","heading":"Questions 6–13","instruction":"Do the following statements agree with the information given in Reading Passage 1?","box":"","lines":[],"items":[{"text":"The Bedouin teenagers who found the scrolls were disappointed by how little\nmoney they received for them.","answer":"NOT GIVEN","options":[],"correct":[],"alts":""},{"text":"There is agreement among academics about the origin of the Dead Sea Scrolls.","answer":"FALSE","options":[],"correct":[],"alts":""},{"text":"Most of the books of the Bible written on the scrolls are incomplete.","answer":"TRUE","options":[],"correct":[],"alts":""},{"text":"The information on the Copper Scroll is written in an unusual way.","answer":"TRUE","options":[],"correct":[],"alts":""},{"text":"Mar Samuel was given some of the scrolls as a gift.","answer":"FALSE","options":[],"correct":[],"alts":""},{"text":"In the early 1950s, a number of educational establishments in the US were keen to buy scrolls from Mar Samuel.","answer":"FALSE","options":[],"correct":[],"alts":""},{"text":"The scroll that was pieced together in 2017 contains information about annual occasions in the Qumran area 2,000 years ago.","answer":"TRUE","options":[],"correct":[],"alts":""},{"text":"Academics at the University of Haifa are currently researching how to decipher the\nfinal scroll.","answer":"NOT GIVEN","options":[],"correct":[],"alts":""}],"options":[]}],"text":"In late 1946 or early 1947, three Bedouin teenagers were tending their goats and sheep\nnear the ancient settlement of Qumran, located on the northwest shore of the Dead\nSea in what is now known as the West Bank. One of these young shepherds tossed a\nrock into an opening on the side of a cliff and was surprised to hear a shattering sound.\nHe and his companions later entered the cave and stumbled across a collection of\nlarge clay jars, seven of which contained scrolls with writing on them. The teenagers\ntook the seven scrolls to a nearby town where they were sold for a small sum to a local\nantiquities dealer. Word of the find spread, and Bedouins and archaeologists eventually\nunearthed tens of thousands of additional scroll fragments from 10 nearby caves;\ntogether they make up between 800 and 900 manuscripts. It soon became clear that this\nwas one of the greatest archaeological discoveries ever made.\n\nThe origin of the Dead Sea Scrolls, which were written around 2,000 years ago between\n150 BCE and 70 CE, is still the subject of scholarly debate even today. According to the\nprevailing theory, they are the work of a population that inhabited the area until Roman\ntroops destroyed the settlement around 70 CE. The area was known as Judea at that\ntime, and the people are thought to have belonged to a group called the Essenes, a\ndevout Jewish sect.\n\nThe majority of the texts on the Dead Sea Scrolls are in Hebrew, with some fragments\nwritten in an ancient version of its alphabet thought to have fallen out of use in the fifth\ncentury BCE. But there are other languages as well. Some scrolls are in Aramaic, the\nlanguage spoken by many inhabitants of the region from the sixth century BCE to the\nsiege of Jerusalem in 70 CE. In addition, several texts feature translations of the Hebrew\nBible into Greek.\n\nThe Dead Sea Scrolls include fragments from every book of the Old Testament of the\nBible except for the Book of Esther. The only entire book of the Hebrew Bible preserved\namong the manuscripts from Qumran is Isaiah; this copy, dated to the first century BCE,\nis considered the earliest biblical manuscript still in existence. Along with biblical texts,\nthe scrolls include documents about sectarian regulations and religious writings that do\nnot appear in the Old Testament.\n\nThe writing on the Dead Sea Scrolls is mostly in black or occasionally red ink, and\nthe scrolls themselves are nearly all made of either parchment (animal skin) or an\nearly form of paper called ‘papyrus’. The only exception is the scroll numbered 3Q15,\nwhich was created out of a combination of copper and tin. Known as the Copper\nScroll, this curious document features letters chiselled onto metal – perhaps, as some\nhave theorized, to better withstand the passage of time. One of the most intriguing\nmanuscripts from Qumran, this is a sort of ancient treasure map that lists dozens of gold\nand silver caches. Using an unconventional vocabulary and odd spelling, it describes 64\nunderground hiding places that supposedly contain riches buried for safekeeping. None\nof these hoards have been recovered, possibly because the Romans pillaged Judea\nduring the first century CE. According to various hypotheses, the treasure belonged to\nlocal people, or was rescued from the Second Temple before its destruction or never\nexisted to begin with.\n\nSome of the Dead Sea Scrolls have been on interesting journeys. In 1948, a Syrian\nOrthodox archbishop known as Mar Samuel acquired four of the original seven scrolls\nfrom a Jerusalem shoemaker and part-time antiquity dealer, paying less than $100\nfor them. He then travelled to the United States and unsuccessfully offered them to a\nnumber of universities, including Yale. Finally, in 1954, he placed an advertisement in\nthe business newspaper The Wall Street Journal – under the category ‘Miscellaneous\nItems for Sale’ – that read: ‘Biblical Manuscripts dating back to at least 200 B.C. are for\nsale. This would be an ideal gift to an educational or religious institution by an individual\nor group.’ Fortunately, Israeli archaeologist and statesman Yigael Yadin negotiated their\npurchase and brought the scrolls back to Jerusalem, where they remain to this day.\n\nIn 2017, researchers from the University of Haifa restored and deciphered one of the last\nuntranslated scrolls. The university’s Eshbal Ratson and Jonathan Ben-Dov spent one\nyear reassembling the 60 fragments that make up the scroll. Deciphered from a band\nof coded text on parchment, the find provides insight into the community of people who\nwrote it and the 364-day calendar they would have used. The scroll names celebrations\nthat indicate shifts in seasons and details two yearly religious events known from\nanother Dead Sea Scroll. Only one more known scroll remains untranslated."}]}};</script>
<script>
(function () {
  const TEST = window.TEST_DATA;
  const $ = id => document.getElementById(id);
  const L = i => String.fromCharCode(65 + i);
  const TF = { TFNG: ["TRUE", "FALSE", "NOT GIVEN"], YNNG: ["YES", "NO", "NOT GIVEN"] };
  const esc = v => String(v == null ? "" : v).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const norm = v => String(v == null ? "" : v).toLowerCase().replace(/[.,;:!?]+$/, "").replace(/\s+/g, " ").trim();

  const SHELL = `
    <header class="header">
      <div class="brand">IELTS <span>Academic Reading</span></div>
      <div class="test-title" id="testTitle"></div>
      <input class="student-name" id="studentName" placeholder="Your name" aria-label="Your name">
      <div class="timer" id="timer">--:--</div>
      <button class="btn" id="submitBtn" type="button">Submit</button>
    </header>
    <nav class="parts" id="partTabs"></nav>
    <main class="split">
      <section class="passage" id="passage"></section>
      <section class="questions" id="questions"></section>
    </main>`;

  const responses = {};
  let part = 0, submitted = false, secondsLeft = 0, timerId = null, resultHTML = "";

  function badge(nos) {
    const text = nos.length > 1 ? `${nos[0]}–${nos[nos.length - 1]}` : nos[0];
    return `<span class="qno">${text}</span>`;
  }

  function renderAll() {
    const p = TEST.parts[part];
    const showLabels = TEST.labels !== false;

    $("partTabs").innerHTML = TEST.parts.map((_, i) =>
      `<button class="${i === part ? "active" : ""}" data-part="${i}">Reading Passage ${i + 1}</button>`).join("");

    $("passage").innerHTML = `<h2>${esc(p.passageTitle)}</h2>` +
      (p.paragraphs || []).map((t, i) =>
        `<p>${showLabels ? `<strong>${L(i)}</strong>&nbsp;&nbsp;` : ""}${esc(t)}</p>`).join("");

    $("questions").innerHTML = resultHTML +
      (p.instruction ? `<div class="instr">${esc(p.instruction)}</div>` : "") +
      (p.groups || []).map(renderGroup).join("");
  }

  function renderGroup(g) {
    const dis = submitted ? "disabled" : "";
    const head = `<div class="qhead">${esc(g.heading)}</div>` +
      (g.instruction ? `<div class="qinstr">${esc(g.instruction)}</div>` : "");

    if (g.type === "GAP") {
      const body = (g.lines || []).map(line => {
        const cls = line.kind === "h" ? "nh" : line.kind === "t" ? "nt" : "noteline";
        const html = esc(line.text).replace(/\{(\d+)\}/g, (_, no) =>
          `<span class="qno">${no}</span><input class="gap" data-no="${no}" value="${esc(responses[no] || "")}" ${dis} autocomplete="off" spellcheck="false">`);
        return `<p class="${cls}">${html}</p>`;
      }).join("");
      return head + `<div class="notes">${g.box ? `<h3 class="nbox">${esc(g.box)}</h3>` : ""}${body}</div>`;
    }

    if (g.type === "MATCH") {
      const options = (g.options || []).map((o, i) => `<div><b>${L(i)}</b> ${esc(o)}</div>`).join("");
      const rows = (g.items || []).map(item => {
        const no = item.nos[0];
        const opts = (g.options || []).map((o, i) =>
          `<option value="${L(i)}" ${responses[no] === L(i) ? "selected" : ""}>${L(i)} — ${esc(o)}</option>`).join("");
        return `<div class="stmt">
          <div class="stmt-text">${badge(item.nos)}${esc(item.text)}</div>
          <select data-no="${no}" ${dis}><option value="">— choose —</option>${opts}</select>
        </div>`;
      }).join("");
      return head + `<div class="optbox"><strong>Options</strong>${options}</div>` + rows;
    }

    return head + (g.items || []).map(item => renderItem(g, item, dis)).join("");
  }

  function renderItem(g, item, dis) {
    const no = item.nos[0];

    if (g.type === "TFNG" || g.type === "YNNG") {
      const opts = TF[g.type].map(o =>
        `<label><input type="radio" name="q${no}" value="${o}" data-no="${no}" ${responses[no] === o ? "checked" : ""} ${dis}> ${o}</label>`).join("");
      return `<div class="stmt"><div class="stmt-text">${badge(item.nos)}${esc(item.text)}</div><div class="tf">${opts}</div></div>`;
    }

    if (g.type === "MCQ") {
      if (item.multi) {
        const chosen = Array.isArray(responses[no]) ? responses[no] : [];
        const opts = (item.options || []).map((o, i) => {
          const l = L(i);
          return `<label class="opt"><input type="checkbox" data-no="${no}" value="${l}" ${chosen.includes(l) ? "checked" : ""} ${dis}> ${l}. ${esc(o)}</label>`;
        }).join("");
        return `<div class="stmt"><div class="stmt-text">${badge(item.nos)}${esc(item.text)}</div>${opts}</div>`;
      }
      const opts = (item.options || []).map((o, i) => {
        const l = L(i);
        return `<label class="opt"><input type="radio" name="q${no}" value="${l}" data-no="${no}" ${responses[no] === l ? "checked" : ""} ${dis}> ${l}. ${esc(o)}</label>`;
      }).join("");
      return `<div class="stmt"><div class="stmt-text">${badge(item.nos)}${esc(item.text)}</div>${opts}</div>`;
    }

    return `<div class="stmt">
      <div class="stmt-text">${badge(item.nos)}${esc(item.text)}</div>
      <input class="short" type="text" data-no="${no}" value="${esc(responses[no] || "")}" ${dis} autocomplete="off">
    </div>`;
  }

  function onAnswer(e) {
    const el = e.target;
    if (submitted || !el.dataset.no) return;
    const no = el.dataset.no;

    if (el.type === "checkbox") {
      const set = new Set(Array.isArray(responses[no]) ? responses[no] : []);
      if (el.checked) set.add(el.value);
      else set.delete(el.value);
      responses[no] = [...set];
    } else if (el.type !== "radio" || el.checked) {
      responses[no] = el.value;
    }
  }

  function markItem(item) {
    if (item.multi) {
      const selected = Array.isArray(responses[item.nos[0]]) ? responses[item.nos[0]] : [];
      const expected = item.answers;
      const ok = selected.length === expected.length && expected.every(a => selected.includes(a));
      return item.nos.map((no, i) => ({ no, ok, mine: selected.join(", "), correct: expected[i] == null ? "" : expected[i] }));
    }
    const no = item.nos[0];
    const mine = responses[no] || "";
    const ok = mine !== "" && item.answers.some(a => norm(a) === norm(mine));
    return [{ no, ok, mine, correct: item.answers.join(" / ") }];
  }

  function submitTest(auto) {
    if (submitted) return;
    submitted = true;
    clearInterval(timerId);
    $("submitBtn").disabled = true;

    const marks = TEST.parts
      .flatMap(p => (p.groups || []).flatMap(g => (g.items || []).flatMap(item => markItem(item))))
      .sort((a, b) => a.no - b.no);

    const correct = marks.filter(m => m.ok).length;
    const total = marks.length;
    const pct = total ? Math.round(correct / total * 100) : 0;
    const name = $("studentName").value.trim();

    const rows = marks.map(m =>
      `<tr class="${m.ok ? "ok" : "bad"}"><td>${m.no}</td><td>${esc(m.mine || "—")}</td><td>${esc(m.correct)}</td><td>${m.ok ? "✓" : "✗"}</td></tr>`).join("");

    resultHTML = `<div class="result">
      <h3>Your result${name ? " – " + esc(name) : ""}${auto ? " (time up)" : ""}</h3>
      <p><strong>${correct} / ${total}</strong> correct (${pct}%)</p>
      <table>
        <thead><tr><th>Q</th><th>Your answer</th><th>Correct answer</th><th></th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;

    renderAll();
    $("questions").scrollTop = 0;
  }

  function updateTimer() {
    const left = Math.max(0, secondsLeft);
    $("timer").textContent = `${String(Math.floor(left / 60)).padStart(2, "0")}:${String(left % 60).padStart(2, "0")}`;
    $("timer").classList.toggle("warn", left <= 300);
  }

  function start() {
    if (!TEST || !Array.isArray(TEST.parts) || !TEST.parts.length) {
      document.getElementById("app").innerHTML = '<div class="msg">This test file is damaged.</div>';
      return;
    }

    document.getElementById("app").innerHTML = SHELL;
    document.title = TEST.title || "Reading test";
    $("testTitle").textContent = TEST.title || "Untitled test";
    secondsLeft = (Number(TEST.time) || 20) * 60;

    $("submitBtn").addEventListener("click", () => {
      if (confirm("Submit the test now?")) submitTest(false);
    });
    $("questions").addEventListener("input", onAnswer);
    $("questions").addEventListener("change", onAnswer);
    $("partTabs").addEventListener("click", e => {
      const b = e.target.closest("[data-part]");
      if (b) { part = Number(b.dataset.part); renderAll(); }
    });

    updateTimer();
    timerId = setInterval(() => {
      if (submitted) return;
      secondsLeft--;
      updateTimer();
      if (secondsLeft <= 0) submitTest(true);
    }, 1000);

    renderAll();
  }

  start();
})();
</script>
</body>
</html>
