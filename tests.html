<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Area | IELTS Academic Reading</title>
<style>:root{--navy:#14263d;--gold:#d8b15f;--paper:#f4f2ed;--muted:#657385}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:#202b38;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}header{background:var(--navy);color:white;border-bottom:4px solid var(--gold)}.bar,main{max-width:900px;margin:auto;padding:22px 24px}.bar{display:flex;justify-content:space-between;align-items:center;gap:16px}.brand{font-weight:800;letter-spacing:.04em}.brand span{color:var(--gold)}button{border:1px solid #d8deE5;border-radius:8px;background:white;padding:10px 14px;font:inherit;cursor:pointer}main{padding-top:50px}.card{margin-top:24px;background:white;border:1px solid #e2ded5;border-radius:14px;padding:24px}h1,h2{color:var(--navy)}p{line-height:1.6;color:var(--muted)}#status{overflow-wrap:anywhere}</style></head>
<body><header><div class="bar"><div class="brand">IELTS <span>ACADEMIC</span> READING</div><button id="signout">Sign out</button></div></header><main><h1>Student area</h1><p id="status">Checking your session…</p><section class="card"><h2>Reading tests</h2><p>Your student account is connected. The test library will be added after we verify authentication.</p></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL='https://yfsxbiqszvrqhsdcuwyr.supabase.co';const SUPABASE_PUBLISHABLE_KEY='sb_publishable_W1BJsbUOZdR0dm5Ai_yHJg_J64HYtPH';
if(!window.supabase){document.getElementById('status').textContent='Could not load the Supabase client library. Check your connection and refresh.';}else{const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);client.auth.getSession().then(({data,error})=>{if(error||!data.session){window.location.replace('login.html');return;}document.getElementById('status').textContent='Signed in as '+data.session.user.email+'.';}).catch(()=>window.location.replace('login.html'));document.getElementById('signout').addEventListener('click',async()=>{await client.auth.signOut();window.location.replace('login.html');});}
</script></body></html>
