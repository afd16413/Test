<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manage tests | IELTS Academic Reading</title>
<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:960px;margin:auto;padding:40px 24px}
h1,h2{color:var(--primary)}
h1{margin:0 0 6px}
p{line-height:1.6;color:var(--muted)}
#status{overflow-wrap:anywhere}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;margin-top:20px}
.move{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.move input{flex:1;min-width:220px;padding:10px 12px;border:1px solid var(--line-2);border-radius:8px;font:inherit;background:var(--surface);color:var(--text)}
.move button{border:0;border-radius:8px;background:var(--primary);color:#fff;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer}
.move button.secondary{background:var(--surface);color:var(--primary);border:1px solid var(--line-2)}
.move button:disabled{opacity:.6}
#count{margin-top:10px;font-size:.9rem}
.divider{border:0;border-top:1px solid var(--line);margin:18px 0}
.group{margin-top:26px}
.group h2{margin:0 0 8px;padding-bottom:4px;border-bottom:2px solid var(--accent);font-size:1.2rem}
.empty,.group p{color:var(--muted)}
.add-link{display:inline-block;margin-left:10px;padding:5px 10px;border-radius:6px;background:var(--accent);color:var(--primary);font-size:.85rem;font-weight:700;text-decoration:none;vertical-align:middle}
.remove-link{margin-left:8px;padding:5px 10px;border:1px solid var(--danger);border-radius:6px;background:var(--surface);color:var(--danger);font:inherit;font-size:.85rem;font-weight:700;cursor:pointer;vertical-align:middle}
.empty{font-size:.95rem;margin:8px 0 0}
.subgroup{margin:18px 0 0;padding-left:12px;border-left:3px solid var(--line)}
.subgroup h3{margin:0;color:var(--text);font-size:1rem}
.subgroup .empty{color:var(--muted)}
.test{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-top:8px;cursor:pointer}
.test input{width:18px;height:18px;flex:0 0 auto}
.test strong{display:block;color:var(--primary)}
.test small{color:var(--muted)}
.error{color:var(--danger)}
</style>
<link rel="stylesheet" href="css/site.css">
<script src="js/theme.js"></script>
</head>
<body>
<header class="site-header" id="siteHeader"></header>
<script src="js/site-nav.js"></script>
<main>
  <h1>Manage tests</h1>
  <p id="status">Checking your session…</p>

  <section class="panel" id="panel" hidden>
    <h2 style="margin-top:0">Move selected tests to a group</h2>
    <p>Tick tests in the list below, then choose an existing group or type a new name.</p>
    <div class="move">
      <input id="groupInput" list="groupList" placeholder="Group name, e.g. Academic Test 17" aria-label="Group name">
      <datalist id="groupList"></datalist>
      <button id="moveBtn" type="button">Move selected</button>
      <button id="ungroupBtn" class="secondary" type="button">Remove from group</button>
    </div>
    <div id="count"></div>

    <hr class="divider">
    <h2>Create group</h2>
    <p>A new group appears straight away, even before any test is in it. Its tests are added with the + Add test button.</p>
    <div class="move">
      <input id="newGroup" placeholder="New group name, e.g. Academic Test 18" aria-label="New group name">
      <button id="createBtn" type="button">Create group</button>
    </div>
  </section>

  <div id="list"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://yfsxbiqszvrqhsdcuwyr.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_W1BJsbUOZdR0dm5Ai_yHJg_J64HYtPH';
const $ = id => document.getElementById(id);
const esc = v => String(v ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const UNGROUPED = 'Ungrouped';
const KINDS = [['reading', 'Reading Tests'], ['listening', 'Listening Tests'], ['writing', 'Writing Tests'], ['speaking', 'Speaking Tests']];

if (!window.supabase) {
  $('status').textContent = 'Could not load the Supabase client library. Check your connection and refresh.';
} else {
  const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
  let tests = [], groupNames = [];

  function selectedIds() {
    return [...document.querySelectorAll('#list input[type=checkbox]:checked')].map(c => c.value);
  }

  function updateCount() {
    const n = selectedIds().length;
    $('count').textContent = n ? `${n} test${n === 1 ? '' : 's'} selected` : 'No tests selected';
  }

  function render() {
    // Every group in the table is shown, even when it is empty.
    const groups = {};
    groupNames.forEach(name => { groups[name] = []; });
    tests.forEach(t => {
      const key = (t.series || '').trim() || UNGROUPED;
      (groups[key] = groups[key] || []).push(t);
    });
    const names = Object.keys(groups).filter(n => n !== UNGROUPED);
    $('groupList').innerHTML = names.map(n => `<option value="${esc(n)}">`).join('');

    $('list').innerHTML = Object.entries(groups).map(([name, items]) => {
      const addLink = name !== UNGROUPED
        ? ` <a class="add-link" href="editor.html?series=${encodeURIComponent(name)}">+ Add test</a>` : '';
      const removeBtn = name !== UNGROUPED
        ? ` <button class="remove-link" type="button" data-remove="${esc(name)}">Remove group</button>` : '';
      // Inside each group, the tests are sorted into sub groups by type: Reading Tests, Writing Tests, and so on.
      const body = KINDS.map(([kind, title]) => {
        const its = items.filter(t => (t.kind || 'reading') === kind);
        const rows = its.length
          ? its.map(t => `
            <label class="test">
              <input type="checkbox" value="${esc(t.id)}">
              <span>
                <strong>${esc(t.label || t.title)}</strong>
                <small>${esc(t.minutes)} min</small>
              </span>
            </label>`).join('')
          : '<p class="empty">No tests yet.</p>';
        return `<div class="subgroup"><h3>${title}</h3>${rows}</div>`;
      }).join('');
      return `<section class="group"><h2>${esc(name)}${addLink}${removeBtn}</h2>${body}</section>`;
    }).join('') || '<p>No tests yet.</p>';
    updateCount();
  }

  async function load() {
    const [t, g] = await Promise.all([
      client.from('tests').select('id,title,label,series,kind,minutes').order('created_at', { ascending: true }),
      client.from('test_groups').select('name').order('name', { ascending: true }),
    ]);
    if (t.error) { $('list').innerHTML = `<p class="error">Could not load tests: ${esc(t.error.message)}</p>`; return; }
    if (g.error) { $('list').innerHTML = `<p class="error">Could not load groups: ${esc(g.error.message)}</p>`; return; }
    tests = t.data;
    // Groups that tests already use are included too, in case they were never listed.
    const used = tests.map(x => (x.series || '').trim()).filter(Boolean);
    groupNames = [...new Set([...g.data.map(x => x.name), ...used])].filter(n => n !== UNGROUPED).sort();
    render();
  }

  // Sets the group of the selected tests. An empty group removes them from their group.
  async function moveSelected(group) {
    const ids = selectedIds();
    if (!ids.length) { alert('Tick at least one test first.'); return; }
    if (group) await ensureGroup(group);
    const { error } = await client.from('tests').update({ series: group }).in('id', ids);
    if (error) { alert('Could not move the tests: ' + error.message); return; }
    await load();
  }

  async function ensureGroup(name) {
    if (groupNames.includes(name)) return;
    const { error } = await client.from('test_groups').insert({ name });
    if (error && !/duplicate/i.test(error.message)) alert('Could not create the group: ' + error.message);
  }

  async function createGroup() {
    const name = $('newGroup').value.trim();
    if (!name) { alert('Type a name for the new group first.'); return; }
    if (name === UNGROUPED) { alert('"Ungrouped" is reserved. Choose another name.'); return; }
    if (groupNames.includes(name)) { alert('A group with this name already exists.'); return; }
    const { error } = await client.from('test_groups').insert({ name });
    if (error) { alert('Could not create the group: ' + error.message); return; }
    $('newGroup').value = '';
    await load();
  }

  // Removing a group does not delete its tests: they become ungrouped.
  async function removeGroup(name) {
    const count = tests.filter(t => (t.series || '').trim() === name).length;
    const note = count ? ` Its ${count} test${count === 1 ? '' : 's'} will become ungrouped (they are not deleted).` : '';
    if (!confirm(`Remove the group "${name}"?${note}`)) return;
    if (count) {
      const { error } = await client.from('tests').update({ series: null }).eq('series', name);
      if (error) { alert('Could not update the tests: ' + error.message); return; }
    }
    const { error } = await client.from('test_groups').delete().eq('name', name);
    if (error) { alert('Could not remove the group: ' + error.message); return; }
    await load();
  }

  async function init() {
    const { data: session } = await client.auth.getSession();
    if (!session.session) { window.location.replace('login.html'); return; }
    const uid = session.session.user.id;

    const { data: admin } = await client.from('admins').select('user_id').eq('user_id', uid).maybeSingle();
    if (!admin) { window.location.replace('tests.html'); return; }

    $('status').textContent = 'Signed in as ' + session.session.user.email + '.';
    $('panel').hidden = false;

    $('moveBtn').addEventListener('click', () => {
      const group = $('groupInput').value.trim();
      if (!group) { alert('Type or choose a group name first.'); return; }
      moveSelected(group);
    });
    $('ungroupBtn').addEventListener('click', () => {
      if (confirm('Remove the selected tests from their group?')) moveSelected(null);
    });
    $('createBtn').addEventListener('click', createGroup);
    $('list').addEventListener('change', updateCount);
    $('list').addEventListener('click', e => {
      const btn = e.target.closest('[data-remove]');
      if (btn) removeGroup(btn.dataset.remove);
    });

    await load();
  }

  init().catch(err => { $('status').textContent = 'Something went wrong: ' + (err.message || err); });

}
</script>
</body>
</html>
