<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Reset Password | IELTS Academic Reading</title>
  <style>
    :root{--primary:#1d4ed8;--primary-2:#1e40af;--accent:#f97316;--paper:#f8fafc;--ink:#111827;--muted:#374151;--line:#dde3ea;--white:#fff;--error:#b42318;--success:#17703a}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column}
    header{background:var(--primary);color:#fff;border-bottom:4px solid var(--accent)}.bar{max-width:1100px;width:100%;margin:auto;padding:21px 24px}.brand{font-weight:800;letter-spacing:.045em}.brand span{color:var(--accent)}
    main{width:100%;max-width:520px;margin:auto;padding:48px 24px;flex:1}
    .card{background:var(--white);border:1px solid var(--line);border-radius:18px;padding:30px;box-shadow:0 18px 50px #14263d0c}
    .card h1{margin:0 0 8px;color:var(--primary);font-size:1.55rem}.sub{margin:0 0 24px;color:var(--muted);line-height:1.5;font-size:.94rem}
    label{display:block;font-weight:700;font-size:.9rem;margin:16px 0 7px}input{width:100%;padding:13px 14px;border:1px solid #c5cdd8;border-radius:9px;background:var(--white);color:var(--ink);font:inherit}input:focus{outline:3px solid #d8b15f55;border-color:#9a3412}
    button{width:100%;border:0;border-radius:9px;padding:13px 16px;margin-top:20px;background:var(--primary);color:#fff;font:inherit;font-weight:750;cursor:pointer}button:hover{background:var(--primary-2)}button:disabled{opacity:.6;cursor:wait}
    .back{display:block;text-align:center;margin-top:20px;color:var(--primary);font-weight:650;font-size:.9rem}
    #message{display:none;margin-top:16px;padding:12px;border-radius:8px;font-size:.9rem;line-height:1.5;overflow-wrap:anywhere}#message.error{display:block;background:#fdecea;color:var(--error)}#message.success{display:block;background:#e5f4ea;color:var(--success)}
    .footer{text-align:center;padding:20px 24px 28px;color:var(--muted);font-size:.8rem}
    @media(max-width:760px){main{padding-top:36px}.card{padding:24px}}
  </style>
</head>
<body>
  <header>
    <div class="bar"><div class="brand">IELTS <span>Academic</span> Reading</div></div>
  </header>
  <main>
    <section class="card" aria-labelledby="reset-heading">
      <h1 id="reset-heading">Set a new password</h1>
      <p class="sub">Choose a new password for your student account. Use at least 6 characters.</p>
      <form id="reset-form" hidden>
        <label for="password">New password</label>
        <input id="password" name="password" type="password" autocomplete="new-password" minlength="6" required>
        <label for="confirm">Confirm new password</label>
        <input id="confirm" name="confirm" type="password" autocomplete="new-password" minlength="6" required>
        <button id="submit-button" type="submit">Update password</button>
      </form>
      <div id="message" role="status" aria-live="polite"></div>
      <a class="back" href="login.html">Back to sign in</a>
    </section>
  </main>
  <footer class="footer">IELTS Academic Reading · Practice assessment portal</footer>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // This is the project's publishable key. Never put a service_role or secret key in browser code.
    const SUPABASE_URL = 'https://yfsxbiqszvrqhsdcuwyr.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_W1BJsbUOZdR0dm5Ai_yHJg_J64HYtPH';
    const message = document.getElementById('message');
    const form = document.getElementById('reset-form');
    const submitButton = document.getElementById('submit-button');
    function showMessage(text, type) { message.textContent = text; message.className = type; }

    if (!window.supabase) {
      showMessage('The Supabase client library could not load. Check your connection and refresh.', 'error');
    } else {
      const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
      let recoveryReady = false;

      // Supabase signs the user in from the emailed link and fires PASSWORD_RECOVERY.
      client.auth.onAuthStateChange((event) => {
        if (event === 'PASSWORD_RECOVERY') showRecoveryForm();
      });

      // If the page loaded after the session was already set, check for it directly.
      client.auth.getSession().then(({ data }) => {
        if (data?.session) showRecoveryForm();
        else if (!recoveryReady) showMessage('This reset link is invalid or has expired. Request a new one from the sign-in page.', 'error');
      });

      function showRecoveryForm() {
        recoveryReady = true;
        form.hidden = false;
        message.className = ''; message.textContent = '';
      }

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        message.className = ''; message.textContent = '';
        const password = document.getElementById('password').value;
        const confirm = document.getElementById('confirm').value;
        if (password !== confirm) { showMessage('The passwords do not match.', 'error'); return; }
        submitButton.disabled = true; submitButton.textContent = 'Updating…';
        try {
          const { error } = await client.auth.updateUser({ password });
          if (error) throw error;
          showMessage('Your password has been updated. Redirecting to sign in…', 'success');
          form.hidden = true;
          await client.auth.signOut();
          setTimeout(() => window.location.replace('login.html'), 2000);
        } catch (error) {
          console.error('Password update error:', error);
          showMessage(String(error?.message || 'Could not update the password. Request a new reset link and try again.'), 'error');
        } finally {
          submitButton.disabled = false; submitButton.textContent = 'Update password';
        }
      });
    }
  </script>
</body>
</html>
