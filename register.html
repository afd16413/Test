<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register | IELTS Academic Reading</title>
  <style>
    :root{--primary:#1d4ed8;--accent:#f97316;--paper:#f8fafc;--ink:#111827;--muted:#374151;--line:#dde3ea;--error:#b42318;--success:#17703a}
    *{box-sizing:border-box}
    body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,sans-serif}
    header{background:var(--primary);color:#fff;border-bottom:4px solid var(--accent);padding:21px 24px;font-weight:800}
    header span{color:var(--accent)}
    main{max-width:460px;margin:48px auto;padding:0 24px}
    .card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:30px}
    h1{color:var(--primary);margin:0 0 8px;font-size:1.6rem}
    p.sub{color:var(--muted);margin:0 0 20px;line-height:1.5}
    label{display:block;font-weight:700;font-size:.9rem;margin:16px 0 7px}
    input{width:100%;padding:12px 14px;border:1px solid #c5cdd8;border-radius:9px;font:inherit}
    button{width:100%;margin-top:20px;padding:13px;border:0;border-radius:9px;background:var(--primary);color:#fff;font:inherit;font-weight:750;cursor:pointer}
    button:disabled{opacity:.6}
    #message{display:none;margin-top:16px;padding:12px;border-radius:8px;font-size:.9rem;line-height:1.5}
    #message.error{display:block;background:#fdecea;color:var(--error)}
    #message.success{display:block;background:#e5f4ea;color:var(--success)}
    a{color:var(--primary)}
  </style>
<link rel="stylesheet" href="css/site.css">
<script src="js/theme.js"></script>
</head>
<body>
  <header class="site-header" id="siteHeader"></header>
<script src="js/site-nav.js"></script>
  <main>
    <section class="card">
      <h1>Create your account</h1>
      <p class="sub">Register to take practice tests and save your scores.</p>
      <form id="register-form">
        <label for="name">Full name</label>
        <input id="name" name="name" type="text" autocomplete="name" required>
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="email" required>
        <label for="password">Password (at least 8 characters)</label>
        <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
        <button id="submit-button" type="submit">Register</button>
      </form>
      <div id="message" role="status" aria-live="polite"></div>
      <p class="sub" style="margin-top:20px">Already registered? <a href="login.html">Sign in</a></p>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const sb = window.supabase.createClient(
      'https://yfsxbiqszvrqhsdcuwyr.supabase.co',
      'sb_publishable_W1BJsbUOZdR0dm5Ai_yHJg_J64HYtPH'
    );
    const message = document.getElementById('message');
    const button = document.getElementById('submit-button');

    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      message.className = ''; message.textContent = '';
      button.disabled = true;
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      try {
        const { data, error } = await sb.auth.signUp({
          email,
          password,
          options: {
            data: { full_name: name },
            emailRedirectTo: new URL('login.html', window.location.href).href
          }
        });
        if (error) throw error;
        if (data.user && data.user.identities && data.user.identities.length === 0) {
          throw new Error('An account with this email already exists. Try signing in.');
        }
        e.target.reset();
        message.className = 'success';
        message.textContent = 'Account created. Check your email to confirm your address, then sign in.';
      } catch (err) {
        message.className = 'error';
        message.textContent = err.message || 'Could not create your account.';
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
