<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teacher reviews | IELTS Academic Practice</title>
<style>
:root{--navy:#13243a;--gold:#d6ad58;--paper:#f5f3ee;--ink:#202a36;--muted:#667384;--line:#e2ded4;--danger:#a52b35}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
header{background:var(--navy);color:#fff;border-bottom:4px solid var(--gold)}
.bar,main{max-width:960px;margin:auto;padding:20px 24px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.brand{font-weight:750;color:inherit;text-decoration:none}.brand span{color:var(--gold)}
.bar nav{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bar a,.bar button{color:var(--navy);background:var(--gold);border:0;text-decoration:none;font:inherit;font-weight:700;font-size:.9rem;padding:8px 14px;border-radius:8px;cursor:pointer}
main{padding-top:40px;padding-bottom:40px}
h1{color:var(--navy);margin:0 0 6px}
.sub{color:var(--muted);margin:0 0 24px}
.review{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;margin-top:16px}
.review .head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:14px}
.review h2{margin:0;color:var(--navy);font-size:1.15rem}
.review .meta{color:var(--muted);font-size:.9rem;margin-top:4px}
.band{background:var(--navy);color:#fff;border-radius:10px;padding:8px 14px;text-align:center;min-width:90px}
.band b{display:block;font-size:1.5rem;color:var(--gold)}
.band small{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase}
.label{font-weight:700;color:var(--navy);font-size:.9rem;margin:0 0 6px}
.comment{white-space:pre-wrap;line-height:1.7;background:#faf9f6;border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:0}
.nocomment{color:var(--muted);font-style:italic;margin:0}
details{margin-top:14px}
summary{cursor:pointer;color:var(--navy);font-weight:700;font-size:.92rem}
.answer{white-space:pre-wrap;line-height:1.7;background:#faf9f6;border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:10px 0 0;font-size:.95rem}
.empty,.msg{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px;color:var(--muted)}
.msg.error{color:var(--danger)}
footer{max-width:960px;margin:0 auto;padding:22px 24px 32px;color:var(--muted);font-size:.82rem}
@media(max-width:600px){main{padding-top:28px}.review{padding:18px}}
</style>
</head>
<body>
<header>
  <div class="bar">
    <a class="brand" href="index.html">IELTS <span>ACADEMIC</span> PRACTICE</a>
    <nav>
      <a href="tests.html">Tests</a>
      <a href="results.html">My results</a>
      <button id="navSignout" type="button" hidden>Sign out</button>
    </nav>
  </div>
</header>
<main>
  <h1>Teacher reviews</h1>
  <p class="sub" id="who">Checking your session…</p>
  <div id="content"></div>
</main>
<footer>IELTS Academic Practice · Practice platform</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://yfsxbiqszvrqhsdcuwyr.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_W1BJsbUOZdR0dm5Ai_yHJg_J64HYtPH';
const esc = v => String(v ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const content = document.getElementById('content');
const who = document.getElementById('who');
const KIND_NAMES = { reading: 'Reading', listening: 'Listening', writing: 'Writing', speaking: 'Speaking' };
const TEST_NAMES = { 'academic-reading-17-test-1': 'Academic Reading 17 Test 1' };

if (!window.supabase) {
  content.innerHTML = '<div class="msg error">Could not load the Supabase client library. Check your connection and refresh.</div>';
} else {
  const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

  // Writing answers are stored as a list of tasks; reading and listening answers are not shown here.
  function answerText(s) {
    if (s.kind !== 'writing' || !Array.isArray(s.answers)) return '';
    return s.answers.map(a => `Task ${a.task}: ${a.title}\n\n${a.text || '(no answer)'}`).join('\n\n———\n\n');
  }

  function card(s, testTitles) {
    const testName = testTitles[s.test_id] || TEST_NAMES[s.test_id] || s.test_id;
    const kind = KIND_NAMES[s.kind] || s.kind;
    const bandBox = s.band != null ? `<div class="band"><small>Band</small><b>${esc(Number(s.band).toFixed(1))}</b></div>` : '';
    const comment = s.teacher_comment
      ? `<p class="label">Teacher comment</p><p class="comment">${esc(s.teacher_comment)}</p>`
      : `<p class="nocomment">The teacher has not written a comment for this one.</p>`;
    const answer = answerText(s);
    const answerBlock = answer
      ? `<details><summary>Show my answer</summary><p class="answer">${esc(answer)}</p></details>`
      : '';
    return `<article class="review">
      <div class="head">
        <div>
          <h2>${esc(testName)} · ${esc(kind)}</h2>
          <div class="meta">Submitted ${esc(new Date(s.created_at).toLocaleString())} · Reviewed ${esc(new Date(s.reviewed_at).toLocaleString())}</div>
        </div>
        ${bandBox}
      </div>
      ${comment}
      ${answerBlock}
    </article>`;
  }

  async function load(uid) {
    const [subs, tests] = await Promise.all([
      client.from('submissions')
        .select('id,test_id,kind,answers,band,teacher_comment,reviewed_at,created_at')
        .eq('user_id', uid)
        .not('reviewed_at', 'is', null)
        .order('reviewed_at', { ascending: false }),
      client.from('tests').select('id,title'),
    ]);

    if (subs.error) {
      content.innerHTML = '<div class="msg error">Could not load your reviews: ' + esc(subs.error.message) + '</div>';
      return;
    }
    if (!subs.data.length) {
      content.innerHTML = '<div class="empty">No reviews yet. When your teacher reviews a writing or speaking answer, it will appear here.</div>';
      return;
    }
    const testTitles = {};
    (tests.data || []).forEach(t => { testTitles[t.id] = t.title; });
    content.innerHTML = subs.data.map(s => card(s, testTitles)).join('');
  }

  client.auth.getSession().then(async ({ data }) => {
    if (!data.session) { window.location.replace('login.html'); return; }
    who.textContent = 'Signed in as ' + data.session.user.email;
    document.getElementById('navSignout').hidden = false;
    document.getElementById('navSignout').addEventListener('click', async () => {
      await client.auth.signOut();
      window.location.replace('login.html');
    });
    await load(data.session.user.id);
  }).catch(err => {
    content.innerHTML = '<div class="msg error">Something went wrong: ' + esc(err.message || err) + '</div>';
  });
}
</script>
</body>
</html>
