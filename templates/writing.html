<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Writing test</title>
<style>
:root { --navy: #1f2d5c; --gold: #f4c542; --gold-2: #e6b530; --bg: #f2f4f8; --line: #dfe3ec; --line-2: #c4cbda; --text: #1c2433; --muted: #5d6679; --danger: #b42318; --danger-bg: #fdecea; --success: #17703a; }
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif; font-size: 15px; line-height: 1.5; }
button, textarea { font: inherit; color: inherit; }
.header { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; background: var(--navy); color: #fff; padding: 12px 24px; }
.brand { font-weight: 700; font-size: 17px; white-space: nowrap; }
.brand span { font-weight: 400; opacity: .75; }
a.brand { color: inherit; text-decoration: none; }
.test-title { flex: 1; min-width: 140px; font-size: 14px; opacity: .9; }
.timer { min-width: 76px; text-align: center; background: #fff; color: var(--navy); padding: 6px 12px; border-radius: 6px; font-weight: 700; font-variant-numeric: tabular-nums; }
.timer.warn { background: var(--gold); }
.btn { background: var(--gold); color: var(--navy); border: none; border-radius: 6px; padding: 8px 14px; font-weight: 600; font-size: 14px; cursor: pointer; }
.btn:hover { background: var(--gold-2); }
.btn:disabled { opacity: .5; cursor: default; }
.parts { display: flex; gap: 2px; flex-wrap: wrap; background: #fff; border-bottom: 1px solid var(--line); padding: 0 24px; }
.parts button { background: none; border: none; border-bottom: 3px solid transparent; color: var(--muted); font-size: 14px; font-weight: 600; padding: 12px 16px; cursor: pointer; }
.parts button.active { color: var(--navy); border-bottom-color: var(--navy); }
.split { display: grid; grid-template-columns: 1fr 1fr; height: calc(100vh - 112px); }
.prompt, .answer { overflow: auto; padding: 28px 36px 64px; }
.prompt { background: #fff; border-right: 1px solid var(--line); line-height: 1.75; }
.prompt h2 { margin: 0 0 16px; color: var(--navy); font-size: 22px; }
.prompt p { margin: 0 0 14px; }
.instr { white-space: pre-line; font-weight: 600; margin-bottom: 12px; }
.question-box { background: #fff; border: 1px solid var(--line); border-left: 4px solid var(--navy); border-radius: 6px; padding: 14px 16px; margin-bottom: 16px; }
.question-box p:last-child { margin-bottom: 0; }
.answer { display: flex; flex-direction: column; gap: 10px; }
textarea.essay { flex: 1; min-height: 320px; width: 100%; padding: 14px; border: 1px solid var(--line-2); border-radius: 8px; background: #fff; font-size: 15px; line-height: 1.6; resize: vertical; }
.count { color: var(--muted); font-size: 14px; font-weight: 600; }
.task-img { display: block; max-width: 100%; height: auto; margin: 16px 0 0; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
.notice { padding: 12px 14px; border-radius: 8px; font-weight: 600; }
.notice.ok { background: #fff; border: 1px solid var(--success); color: var(--success); }
.notice.bad { background: var(--danger-bg); color: var(--danger); }
@media (max-width: 820px) {
  .split { grid-template-columns: 1fr; height: auto; }
  .prompt, .answer { padding: 20px 16px 40px; overflow: visible; }
  .header { padding: 10px 14px; }
  .parts { padding: 0 14px; }
}
</style>
</head>
<body>
<div id="app"></div>
<script>window.TEST_DATA = __TEST_DATA__;</script>
<script>
(function () {
  const TEST = window.TEST_DATA;
  const $ = id => document.getElementById(id);
  const esc = v => String(v == null ? "" : v).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const words = t => (String(t || "").trim().match(/\S+/g) || []).length;
  const countText = (t, min) => {
    const n = words(t);
    if (!min) return `${n} words`;
    return `${n} / ${min} words${n < min ? " · below the minimum" : " · minimum reached"}`;
  };

  const SHELL = `
    <header class="header">
      <a class="brand" href="index.html">IELTS <span>Academic Writing</span></a>
      <div class="test-title" id="testTitle"></div>
      <div class="timer" id="timer">--:--</div>
      <button class="btn" id="submitBtn" type="button">Submit</button>
    </header>
    <nav class="parts" id="partTabs"></nav>
    <main class="split">
      <section class="prompt" id="prompt"></section>
      <section class="answer" id="answer"></section>
    </main>`;

  const texts = {};
  let part = 0, submitted = false, secondsLeft = 0, timerId = null, notice = "";

  function renderAll() {
    const p = TEST.parts[part];
    $("partTabs").innerHTML = TEST.parts.map((_, i) =>
      `<button class="${i === part ? "active" : ""}" data-part="${i}">Task ${i + 1}</button>`).join("");

    // Layout: instruction (plain text), task prompt in a box, second instruction (plain text),
    // then the Task 1 image (outside the box, still on the left side).
    const box = p.paragraphs && p.paragraphs.length
      ? `<div class="question-box">${p.paragraphs.map(t => `<p>${esc(t)}</p>`).join("")}</div>`
      : "";
    $("prompt").innerHTML = `<h2>${esc(p.passageTitle)}</h2>` +
      (p.instruction ? `<div class="instr">${esc(p.instruction)}</div>` : "") +
      box +
      (p.instruction2 ? `<div class="instr">${esc(p.instruction2)}</div>` : "") +
      (p.imageUrl ? `<img class="task-img" src="${esc(p.imageUrl)}" alt="Task chart or diagram">` : "");

    const cls = notice.startsWith("Could not") ? "bad" : "ok";
    $("answer").innerHTML = (notice ? `<div class="notice ${cls}">${esc(notice)}</div>` : "") +
      `<textarea class="essay" id="essay" aria-label="Your answer" ${submitted ? "disabled" : ""}>${esc(texts[part] || "")}</textarea>` +
      `<div class="count" id="count">${countText(texts[part], p.minWords)}</div>`;
  }

  function updateTimer() {
    const left = Math.max(0, secondsLeft);
    $("timer").textContent = `${String(Math.floor(left / 60)).padStart(2, "0")}:${String(left % 60).padStart(2, "0")}`;
    $("timer").classList.toggle("warn", left <= 300);
  }

  async function submitTest(auto) {
    if (submitted) return;
    submitted = true;
    clearInterval(timerId);
    $("submitBtn").disabled = true;
    const answers = TEST.parts.map((p, i) => ({ task: i + 1, title: p.passageTitle, text: texts[i] || "", words: words(texts[i]) }));
    const error = await window.saveSubmission("writing", answers);
    notice = error
      ? "Could not save your answers: " + error
      : (auto ? "Time is up. " : "") + "Submitted. Your answers have been sent to your teacher.";
    renderAll();
  }

  function start() {
    if (!TEST || !Array.isArray(TEST.parts) || !TEST.parts.length) {
      $("app").innerHTML = '<div class="notice bad" style="margin:24px">This test file is damaged.</div>';
      return;
    }
    $("app").innerHTML = SHELL;
    document.title = TEST.title || "Writing test";
    $("testTitle").textContent = TEST.title || "Untitled test";
    secondsLeft = (Number(TEST.time) || 20) * 60;

    $("submitBtn").addEventListener("click", () => {
      if (confirm("Submit your answers now?")) submitTest(false);
    });
    $("answer").addEventListener("input", e => {
      if (e.target.id !== "essay") return;
      texts[part] = e.target.value;
      $("count").textContent = countText(texts[part], TEST.parts[part].minWords);
    });
    $("partTabs").addEventListener("click", e => {
      const b = e.target.closest("[data-part]");
      if (b) { part = Number(b.dataset.part); renderAll(); }
    });

    updateTimer();
    timerId = setInterval(() => {
      if (submitted) return;
      secondsLeft--;
      updateTimer();
      if (secondsLeft <= 0) submitTest(true);
    }, 1000);

    renderAll();
  }

  start();
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // Saves the student's answers to the "submissions" table. Returns an error message, or null on success.
  window.saveSubmission = async function (kind, answers) {
    const TEST = window.TEST_DATA;
    if (!window.supabase) return 'The Supabase library could not load.';
    if (!TEST.id) return 'This test is not published, so nothing was saved.';
    const sb = window.supabase.createClient(
      'https://yfsxbiqszvrqhsdcuwyr.supabase.co',
      'sb_publishable_W1BJsbUOZdR0dm5Ai_yHJg_J64HYtPH'
    );
    const { data } = await sb.auth.getSession();
    if (!data.session) return 'You are not signed in, so the answers were not saved.';
    const { error } = await sb.from('submissions').insert({ test_id: TEST.id, kind, answers });
    return error ? error.message : null;
  };
</script>
</body>
</html>
